services:
  db:
    image: postgres:16-alpine
    container_name: mechtech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-mechtech}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mechtech}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mechtech_net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: mechtech_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-mechtech}
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS: '["https://mechtech.example.com", "http://localhost"]'
      LOG_LEVEL: INFO
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mechtech_net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: mechtech_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - mechtech_net

volumes:
  postgres_data:
  app_data:

networks:
  mechtech_net:
    driver: bridge
