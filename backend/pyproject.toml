[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechtech-backend"
version = "0.1.0"
description = "MechTech backend API: equipment monitoring, ML and knowledge graph services."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic[email]>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pwdlib[argon2]>=0.2",
  "numpy>=2.2",
  "pandas>=2.2",
  "scipy>=1.15",
  "scikit-learn>=1.6",
  "joblib>=1.4",
  "networkx>=3.4",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
